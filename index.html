<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello from Claude Code</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #0b1d2a; color: #e8f4f8; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  p { opacity: .8; margin: 0 0 20px; }
  img { max-width: 100%; width: 420px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.5); cursor: pointer; transition: transform .2s; }
  img.wiggle { animation: wiggle .5s; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
  #count { margin-top: 16px; font-size: 1.1rem; }
</style>
</head>
<body>
  <h1>Hi Poofy! 🐙</h1>
  <p>Your test repo works with Claude Code. Tap the kraken.</p>
  <img id="kraken" src="funny%20kraken%20ship%20seamonster.jpg" alt="Kraken attacking a ship">
  <div id="count">Ships sunk: 0</div>
<script>
  let n = 0;
  const img = document.getElementById('kraken');
  img.addEventListener('click', () => {
    n++;
    document.getElementById('count').textContent = 'Ships sunk: ' + n;
    img.classList.remove('wiggle'); void img.offsetWidth; img.classList.add('wiggle');
  });
</script>
</body>
</html>
