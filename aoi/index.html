<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071034">
<title>Aoi explains Claude Code on your phone</title>
<style>
:root{
  --ink:#071034; --accent:#0E2A7A; --royal:#1F4FC0; --cyan:#36C9F0; --mark:#1A9BD0; --soft:#E6F7FD;
  --muted:#69739A; --line:#D9DFEE; --row:#F1F4FB; --card:#FFFFFF; --ok:#1FA971;
  --hi:rgba(54,201,240,.16); --ring:rgba(54,201,240,.30); --shadow:rgba(11,22,64,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:#fff; overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none;
}
#stage{
  position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
  background:linear-gradient(180deg,#fff 0%,#fff 55%,rgba(54,201,240,.10) 100%);
  padding:env(safe-area-inset-top) 0 0;
}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(1200px 700px at 30% -200px,rgba(31,79,192,.07),rgba(31,79,192,0));}
.wrap{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:0 16px}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex:none}
#title{font-weight:800;font-size:15px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title i{color:var(--mark);font-style:italic}
.btn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--accent);
  display:grid;place-items:center;cursor:pointer;flex:none}
.btn:active{transform:scale(.94)}
.btn svg{width:18px;height:18px}
#dots{display:flex;gap:5px;padding:0 0 10px;flex:none}
#dots span{flex:1;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
#dots span b{display:block;height:100%;width:0;background:var(--cyan)}

/* content card */
#cardZone{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0 10px}
#card{width:100%;max-height:100%;background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:0 10px 30px var(--shadow);padding:16px;position:relative;overflow:hidden}
#card.enter{animation:drop .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-18px) scale(.97)}to{opacity:1;transform:none}}
.ctag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mark);margin-bottom:10px}

/* subtitle */
#sub{flex:none;position:relative;z-index:3;background:rgba(255,255,255,.96);border:1.5px solid var(--line);border-radius:16px;
  padding:10px 14px 12px;min-height:78px;box-shadow:0 6px 18px var(--shadow)}
#who{position:absolute;top:-11px;left:14px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
  letter-spacing:.08em;padding:3px 10px;border-radius:20px}
#line{font-size:17px;line-height:1.38;font-weight:600;padding-top:4px}
#line .caret{display:inline-block;width:2px;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blinkc .8s steps(1) infinite}
@keyframes blinkc{50%{opacity:0}}
#hint{position:absolute;top:-9px;right:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:10px;color:var(--muted);letter-spacing:.06em}

/* host */
#host{flex:none;position:relative;display:flex;justify-content:center;align-items:flex-end;margin-top:-6px}
#host::before{content:"";position:absolute;left:50%;bottom:0;width:120%;height:120%;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(54,160,230,.22),rgba(54,160,230,0));pointer-events:none}
#aoi{display:block;position:relative}

/* ---------- mock UI pieces ---------- */
.phone{border:2px solid var(--ink);border-radius:22px;padding:10px 10px 12px;background:#fff;max-width:300px;margin:0 auto;position:relative;overflow:hidden}
.phone .notch{width:70px;height:6px;border-radius:4px;background:var(--ink);margin:0 auto 10px;opacity:.85}
.apphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.apphead h3{font-size:20px;font-weight:800}
.tabs{display:flex;gap:6px}
.tabs span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px;background:var(--row);color:var(--muted)}
.tabs span.on{background:var(--accent);color:#fff}
.sess{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--row);margin-bottom:8px;opacity:0;animation:pop .4s ease-out both}
.sess .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--mark)}
.sess .ic svg{width:20px;height:20px}
.sess b{display:block;font-size:14px}
.sess small{font-size:11px;color:var(--muted)}
.sess .st{margin-left:auto;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;background:var(--hi);color:var(--accent)}
.sess.hl{box-shadow:0 0 0 2px var(--ring)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d1{animation-delay:.35s!important}.d2{animation-delay:.8s!important}.d3{animation-delay:1.3s!important}
.d4{animation-delay:1.9s!important}.d5{animation-delay:2.6s!important}.d6{animation-delay:3.4s!important}
.fab{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:300}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lane{border-radius:16px;background:var(--row);padding:12px 8px;text-align:center;opacity:0;animation:pop .45s ease-out both}
.lane h4{font-size:13px;font-weight:800;margin-bottom:8px}
.lane .pic{display:flex;flex-direction:column;align-items:center;gap:4px}
.lane .pic svg{width:46px;height:46px;color:var(--accent)}
.lane .lbl{font-size:11px;color:var(--muted);font-weight:600}
.lane .arrow{color:var(--cyan);font-size:18px;line-height:1}
.lane.cloud{box-shadow:inset 0 0 0 2px var(--ring)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:14px;padding:5px 10px;display:inline-flex;align-items:center;gap:5px}
.chip.cy{border-color:var(--cyan);color:var(--accent);background:var(--soft)}
.input{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.send{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;animation:tap 1.6s .6s ease-out 1 both}
.send svg{width:16px;height:16px}
@keyframes tap{0%{box-shadow:0 0 0 0 rgba(54,201,240,.7)}40%{transform:scale(.85);box-shadow:0 0 0 10px rgba(54,201,240,0)}60%{transform:none}100%{box-shadow:0 0 0 0 rgba(54,201,240,0)}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);border-radius:18px 18px 0 0;
  padding:10px 12px 12px;box-shadow:0 -10px 24px var(--shadow);transform:translateY(105%);animation:sheet .5s 1.7s cubic-bezier(.2,1,.3,1) both}
@keyframes sheet{to{transform:none}}
.sheet .grab{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet h5{font-size:14px;font-weight:800;margin-bottom:6px}
.repo{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 8px;border-radius:10px}
.repo svg{width:15px;height:15px;color:var(--muted);flex:none}
.repo.hl{background:var(--hi);font-weight:700}

.gh h3{font-size:16px;font-weight:800;margin-bottom:2px}
.gh p.s{font-size:11px;color:var(--muted);margin-bottom:10px}
.radio{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:6px;border:1.5px solid var(--line)}
.radio i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.radio.on{border-color:var(--cyan);background:var(--soft)}
.radio.on i{border-color:var(--accent)}
.radio.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.radio.anim{animation:sel .01s 1.3s both}
.radio.anim.off{animation:unsel .01s 1.3s both}
@keyframes sel{to{border-color:var(--cyan);background:var(--soft)}}
@keyframes unsel{to{border-color:var(--line);background:#fff}}
.dotfill{position:absolute;inset:3px;border-radius:50%;background:var(--accent);opacity:0}
.radio.anim .dotfill{animation:fadein .2s 1.3s both}
.radio.anim.off .dotfill{opacity:1;animation:fadeout .2s 1.3s both}
@keyframes fadein{to{opacity:1}} @keyframes fadeout{to{opacity:0}}
.picked{display:flex;flex-direction:column;gap:5px;margin:4px 0 0 28px}
.picked .repo{border:1.5px dashed var(--line);opacity:0;animation:pop .35s ease-out both}
.lock{margin-left:auto;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em}

.desk{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.laptop{width:62%}
.screen{background:var(--ink);border-radius:10px 10px 4px 4px;padding:10px;font:600 11px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#cfe9ff;min-height:104px}
.screen .p{color:var(--cyan)}
.screen .t{opacity:0;animation:pop .3s ease-out both}
.base{height:9px;background:#c9d1e6;border-radius:0 0 10px 10px;margin:0 -10px}
.link{flex:1;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,transparent 6px 11px);background-size:22px 2px;animation:flow 1s linear infinite;margin-bottom:22px}
@keyframes flow{to{background-position:22px 0}}
.mini{width:58px;border:2px solid var(--ink);border-radius:12px;padding:6px 5px;background:#fff}
.mini .bar{height:5px;border-radius:3px;background:var(--row);margin-bottom:4px}
.mini .bar.c{background:var(--cyan)}
.mini .pad{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:6px}
.mini .pad i{height:10px;border-radius:3px;background:var(--soft)}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:12px;background:var(--row)}
.badge .led{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,169,113,.18);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(31,169,113,0)}}

.check{list-style:none}
.check li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--row);margin-bottom:8px;font-size:15px;font-weight:700}
.check .n{font-size:11px;color:var(--muted);font-weight:800;width:14px}
.check .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-left:auto;background:#fff}
.check .bx svg{width:14px;height:14px;color:#fff;opacity:0}
.check li.tick .bx{animation:boxon .3s ease-out both}
.check li.tick .bx svg{animation:fadein .2s ease-out both;animation-delay:inherit}
.check li.tick{animation:rowon .3s ease-out both}
@keyframes boxon{to{background:var(--accent);border-color:var(--accent)}}
@keyframes rowon{to{background:var(--soft)}}
.check .mono{font:600 12px ui-monospace,Menlo,monospace;color:var(--accent);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px}

.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;margin-top:10px;opacity:0;animation:pop .4s ease-out both}
.toast .okc{width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.toast .okc svg{width:14px;height:14px}
.toast b{font-size:13px;display:block}
.toast small{font-size:11px;opacity:.75}
.spark{position:absolute;color:var(--cyan);font-size:18px;opacity:0;animation:sparkle 1.6s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.diff{font:600 11px/1.6 ui-monospace,Menlo,monospace;border-radius:10px;background:var(--row);padding:8px 10px}
.diff .a{color:var(--ok)}

body.paused *{animation-play-state:paused!important}
@media (max-height:700px){ #line{font-size:15px} #sub{min-height:72px} .sess{padding:8px} .check li{padding:8px 10px} }
@media (max-height:620px){ .phone .notch{display:none} .ctag{margin-bottom:6px} }
</style>
</head>
<body>
<div id="stage">
  <div class="wrap">
    <div id="top">
      <div id="title">Aoi explains · <i>Claude Code on your phone</i></div>
      <button class="btn" id="bRestart" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="btn" id="bPlay" aria-label="Pause"></button>
    </div>
    <div id="dots"></div>
    <div id="cardZone"><div id="card"></div></div>
    <div id="sub"><div id="who">AOI</div><div id="line"></div><div id="hint">tap to skip</div></div>
    <div id="host"><canvas id="aoi"></canvas></div>
  </div>
</div>

/* ---------- sprites ---------- */
const IMG = {};
let loaded = 0; const keys = Object.keys(SPR);
const ready = new Promise(res => { if (!keys.length) res(); keys.forEach(k => { const im = new Image(); im.onload = () => { if (++loaded === keys.length) res(); }; im.src = SPR[k]; IMG[k] = im; }); });

const cv = document.getElementById('aoi'), cx = cv.getContext('2d');
let S = 1, DPR = 1;
function sizeHost() {
  DPR = window.devicePixelRatio || 1;
  const vh = window.innerHeight, vw = Math.min(window.innerWidth, 520) - 32;
  const target = Math.min(vh * 0.32, vw * 0.85, 300);          // css px we'd like her to be
  S = Math.max(1, Math.floor(target * DPR / 256 * 2) / 2);     // whole/half device-pixel steps, no smoothing => crisp pixels
  cv.width = 256 * S; cv.height = 256 * S;
  cv.style.width = (256 * S / DPR) + 'px'; cv.style.height = (256 * S / DPR) + 'px';
}
addEventListener('resize', sizeHost); sizeHost();

const BLINKABLE = new Set([null, 'eyes_wide', 'eyes_determined', 'eyes_side']);
function drawAoi(f) {
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.imageSmoothingEnabled = false;
  const by = Math.round(Math.round(f.bob) * S);                               // bob in whole sprite pixels
  const put = (key, x, y) => { const im = IMG[key]; if (im) cx.drawImage(im, Math.round(x * S), Math.round(y * S) + by, Math.round(im.width * S), Math.round(im.height * S)); };
  if (f.pose) {
    const parts = MAN.poses[f.pose].parts;
    put('pose:' + f.pose, 0, 0);
    if (f.blink && parts.blink) put('pose:' + f.pose + ':blink', parts.blink.x, parts.blink.y);
    if (f.mouth && parts[f.mouth]) put('pose:' + f.pose + ':' + f.mouth, parts[f.mouth].x, parts[f.mouth].y);
  } else {
    put('base', 0, 0);
    const eyes = f.blink && BLINKABLE.has(f.eyes) ? 'blink' : f.eyes;
    if (eyes) put(eyes, MAN.parts[eyes].x, MAN.parts[eyes].y);
    if (f.mouth) put(f.mouth, MAN.parts[f.mouth].x, MAN.parts[f.mouth].y);
  }
}

/* ---------- player ---------- */
const CPS = 26, HOLD = 2.6, LAST_HOLD = 4;
const $card = document.getElementById('card'), $line = document.getElementById('line'), $dots = document.getElementById('dots');
const $play = document.getElementById('bPlay');
$dots.innerHTML = SCENES.map(() => '<span><b></b></span>').join('');
let idx = 0, st = 0, playing = true, ended = false, nextBlink = 1.5, clock = 0;
const dur = i => SCENES[i].text.length / CPS + (i === SCENES.length - 1 ? LAST_HOLD : HOLD);

function setPlay(p) {
  playing = p; document.body.classList.toggle('paused', !p);
  $play.innerHTML = p ? I.pause : I.play; $play.setAttribute('aria-label', p ? 'Pause' : 'Play');
}
function show(i) {
  idx = i; st = 0; ended = false;
  const sc = SCENES[i];
  $card.classList.remove('enter'); $card.innerHTML = sc.card(); void $card.offsetWidth; $card.classList.add('enter');
  [...$dots.children].forEach((d, k) => d.firstChild.style.width = k < i ? '100%' : '0');
  fitCard(); renderLine();
}
// shrink the card on short screens so nothing is cut off
function fitCard() {
  const z = document.getElementById('cardZone');
  $card.style.zoom = 1; $card.style.maxHeight = 'none';
  const avail = z.clientHeight - 14, need = $card.offsetHeight;
  if (need > avail) $card.style.zoom = Math.max(0.6, avail / need).toFixed(3);
  $card.style.maxHeight = '';
}
addEventListener('resize', () => fitCard());
function shown() { return Math.min(SCENES[idx].text.length, Math.floor(st * CPS)); }
// subtitles show one sentence at a time, typed out
const SENT = SCENES.map(sc => { const out = []; const re = /[^.!?]+[.!?]+["']?\s*/g; let m, end = 0; while ((m = re.exec(sc.text))) { out.push([m.index, m.index + m[0].length]); end = m.index + m[0].length; } if (end < sc.text.length) out.push([end, sc.text.length]); return out; });
function renderLine() {
  const t = SCENES[idx].text, n = shown();
  const seg = SENT[idx].find(([a, b]) => n < b) || SENT[idx][SENT[idx].length - 1];
  // keep the finished sentence until the next one starts typing
  const a = seg[0] === n && seg[0] > 0 ? SENT[idx][SENT[idx].indexOf(seg) - 1][0] : seg[0];
  const vis = t.slice(a, Math.max(n, a)).trim();
  $line.innerHTML = esc(vis) + (n < t.length ? '<span class="caret"></span>' : '');
  if (SCENES[idx].ticks) {
    const said = t.slice(0, n);
    $card.querySelectorAll('.check li').forEach(li => { if (said.includes(li.dataset.at)) li.classList.add('tick'); });
  }
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function mouthFor(n) {
  const t = SCENES[idx].text; if (n >= t.length) return null;
  const ch = t[n - 1] || ' ';
  if (/[\s.,!?'"]/.test(ch)) return null;
  if (/[aeiAEI]/.test(ch)) return 'mouth_open';
  if (/[ouOU]/.test(ch)) return 'mouth_o';
  return 'mouth_mid';
}

function tap(e) {
  if (e.target.closest('button')) return;
  const t = SCENES[idx].text;
  if (shown() < t.length) { st = t.length / CPS; renderLine(); }
  else if (idx < SCENES.length - 1) show(idx + 1);
  else { show(0); }
  if (!playing) setPlay(true);
}
document.getElementById('stage').addEventListener('click', tap);
$play.addEventListener('click', e => { e.stopPropagation(); if (ended && idx === SCENES.length - 1) { show(0); } setPlay(!playing); });
document.getElementById('bRestart').addEventListener('click', e => { e.stopPropagation(); show(0); setPlay(true); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); } if (e.code === 'ArrowRight') tap({ target: document.body }); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) {
    st += dt; clock += dt;
    renderLine();
    if (st >= dur(idx)) {
      if (idx < SCENES.length - 1) show(idx + 1);
      else { ended = true; setPlay(false); st = dur(idx); }
    }
  }
  const sc = SCENES[idx], n = shown(), talking = n < sc.text.length;
  $dots.children[idx].firstChild.style.width = Math.min(100, st / dur(idx) * 100) + '%';
  // blink: random, ~every 2.5-5.5 s, 130 ms long
  if (clock > nextBlink + 0.13) nextBlink = clock + 2.5 + Math.random() * 3;
  const blink = clock >= nextBlink && clock < nextBlink + 0.13;
  // mouth flaps change at ~11 Hz while typing
  const mouth = talking ? mouthFor(Math.floor(Math.floor(st * 11) / 11 * CPS)) : null;
  const eyes = !talking && sc.endEyes ? sc.endEyes : sc.eyes;
  drawAoi({ pose: sc.pose, eyes, blink, mouth, bob: Math.sin(clock * 2.2) * 1.5 });
  requestAnimationFrame(frame);
}
ready.then(() => { setPlay(true); show(Math.max(0, Math.min(SCENES.length - 1, (parseInt((location.hash.match(/\d+/) || [1])[0]) || 1) - 1))); requestAnimationFrame(t => { last = t; frame(t); }); });
</script>
</body>
